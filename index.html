<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>編碼工具</title>
<style>
:root{
  --bg:#f7f9f8; --surf:#ffffff; --ink:#1f3a3d; --mut:#5d7074; --line:#d8e2df;
  --acc:#3e6b5c; --acc2:#d4733a; --acc4:#5c7d8a; --on:#3e6b5c; --onbg:#e8f0ec;
  --warn:#b45309; --warnbg:#fdf4e7;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --bg:#13201f; --surf:#1b2b2b; --ink:#e8efec; --mut:#9fb3ae; --line:#2b403f;
  --acc:#7fa08e; --acc2:#e08a4f; --acc4:#8aa8b3; --on:#a8c4b6; --onbg:#24413a;
  --warn:#e0a458; --warnbg:#33281a;
}}
:root[data-theme="dark"]{
  --bg:#13201f; --surf:#1b2b2b; --ink:#e8efec; --mut:#9fb3ae; --line:#2b403f;
  --acc:#7fa08e; --acc2:#e08a4f; --acc4:#8aa8b3; --on:#a8c4b6; --onbg:#24413a;
  --warn:#e0a458; --warnbg:#33281a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 120px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
.sp{flex:1}
.meta{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
  background:var(--surf);color:var(--ink);padding:7px 13px;transition:.12s}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:20px}
.segno{font-size:12px;color:var(--mut);letter-spacing:.08em;margin-bottom:10px;
  font-variant-numeric:tabular-nums}
.segtxt{font-size:23px;line-height:1.75;font-weight:500;min-height:120px;
  white-space:pre-wrap;word-break:break-word}
.grp{margin-top:18px}
.glab{font-size:12px;font-weight:700;letter-spacing:.06em;margin-bottom:8px;color:var(--mut)}
.codes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.codes{grid-template-columns:1fr}}
.code{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:9px;
  border:1.5px solid var(--line);background:var(--surf);text-align:left;width:100%}
.code .k{font-size:11px;font-weight:700;width:19px;height:19px;flex:none;border-radius:5px;
  display:grid;place-items:center;background:var(--line);color:var(--mut);
  font-variant-numeric:tabular-nums}
.code .nm{font-size:14.5px;font-weight:600;line-height:1.3}
.code[aria-pressed="true"]{border-color:var(--on);background:var(--onbg)}
.code[aria-pressed="true"] .k{background:var(--on);color:var(--surf)}
.code[aria-pressed="true"] .nm{color:var(--on)}
.code:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
textarea{width:100%;margin-top:14px;padding:10px 12px;border-radius:8px;resize:vertical;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.nav{display:flex;gap:9px;align-items:center;margin-top:16px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--mut);margin-top:12px;line-height:1.75}
kbd{font-family:ui-monospace,monospace;font-size:11.5px;background:var(--line);
  border-radius:4px;padding:1px 5px;color:var(--ink)}
.ref h2{font-size:13px;margin:0 0 12px;letter-spacing:.05em;color:var(--mut);font-weight:700}
.ref dl{margin:0}
.ref .item{padding:11px 0;border-top:1px solid var(--line)}
.ref .item:first-child{border-top:0;padding-top:0}
.ref dt{font-size:14px;font-weight:700;color:var(--acc);display:flex;gap:7px;align-items:center}
.ref dt .k{font-size:10.5px;background:var(--line);color:var(--mut);border-radius:4px;
  padding:1px 5px;font-weight:700}
.ref dd{margin:5px 0 0;font-size:12.5px;color:var(--mut);line-height:1.6}
.ref dd b{color:var(--ink);font-weight:600}
.ref .item.hot{background:var(--onbg);margin:0 -10px;padding-left:10px;padding-right:10px;
  border-radius:8px;border-top-color:transparent}
.grid{position:fixed;left:0;right:0;bottom:0;background:var(--surf);
  border-top:1px solid var(--line);padding:9px 16px}
.dots{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:3px}
.dot{width:15px;height:15px;border-radius:3.5px;border:1px solid var(--line);
  background:transparent;padding:0;font-size:0;flex:none}
.dot.done{background:var(--acc);border-color:var(--acc)}
.dot.zero{background:var(--line);border-color:var(--mut)}
.dot.now{outline:2px solid var(--acc2);outline-offset:1px}
.note{background:var(--warnbg);border:1px solid var(--warn);border-radius:9px;
  padding:11px 13px;font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.65}
.note b{color:var(--warn)}
.done-msg{background:var(--onbg);border:1px solid var(--on);border-radius:9px;
  padding:13px;margin-top:14px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>共享能動性反思行動　編碼</h1>
  <span class="meta" id="prog">—</span>
  <span class="sp"></span>
  <button id="theme" title="切換深淺色">◐</button>
  <button id="imp">匯入進度</button>
  <button class="primary" id="exp">匯出 CSV</button>
</header>
<div class="bar"><i id="barfill" style="width:0"></i></div>
<div class="note">
  <b>獨立編碼中。</b>不要開 <code>編碼信度_原始編碼對照（勿交給第二編碼者）.csv</code>。
  照編碼手冊判，不要去猜原始編碼者會怎麼給碼。本筆若九碼皆無，按 <kbd>0</kbd> 或「確認無碼」，
  留白會被當成還沒編。進度存在瀏覽器裡，<b>編完務必按「匯出 CSV」</b>。
</div>
<div class="main">
  <div>
    <div class="card">
      <div class="segno" id="segno">—</div>
      <div class="segtxt" id="segtxt">載入中⋯</div>
      <div id="groups"></div>
      <textarea id="memo" rows="2" placeholder="備註：判斷有疑義的理由（選填）"></textarea>
      <div class="nav">
        <button id="prev">← 上一筆</button>
        <button id="zero">確認無碼　<kbd>0</kbd></button>
        <button class="primary" id="next">下一筆 →</button>
        <span class="sp"></span>
        <button id="jump">跳到未編</button>
      </div>
      <div class="hint">
        <kbd>1</kbd>–<kbd>9</kbd> 切換編碼　<kbd>Enter</kbd> 或 <kbd>→</kbd> 下一筆　<kbd>←</kbd> 上一筆　
        <kbd>0</kbd> 確認無碼　<kbd>N</kbd> 寫備註
      </div>
      <div id="finish"></div>
    </div>
  </div>
  <div class="card ref">
    <h2>編碼手冊</h2>
    <dl id="book"></dl>
  </div>
</div>
</div>
<div class="grid"><div class="dots" id="dots"></div></div>
<input type="file" id="file" accept=".csv" hidden>
<script>
const DATA = {"segs": [{"n": 1, "id": "C511", "rev": "S48", "grp": "G7", "txt": "製作成果的時間可以多一點，會不會更專心聽其他人的發表？"}, {"n": 2, "id": "C520", "rev": "S24", "grp": "G7", "txt": "為什麼會想到結合KB原則？好厲害"}, {"n": 3, "id": "C317", "rev": "S36", "grp": "G4", "txt": "從學生的提問做為課程的出發，並且可以聚焦小組成果"}, {"n": 4, "id": "C066", "rev": "S08", "grp": "G1", "txt": "我覺得已經很棒了欸！針對最後提到的校外教學我覺得也很棒，讓學生實地探查，實現戶外教育。"}, {"n": 5, "id": "C133", "rev": "S06", "grp": "G1", "txt": "可以增加默契詞"}, {"n": 6, "id": "C545", "rev": "S18", "grp": "G7", "txt": "「同儕學習」的評分略低，可以再思考如何促進學生組別間的交流與討論。"}, {"n": 7, "id": "C193", "rev": "S28", "grp": "G3", "txt": "如何設計外在動機讓學生願意上台發表？"}, {"n": 8, "id": "C439", "rev": "S06", "grp": "G6", "txt": "我覺得很好沒有需要建議的"}, {"n": 9, "id": "C548", "rev": "S35", "grp": "G6", "txt": "如何有更清楚的課程引導"}, {"n": 10, "id": "C382", "rev": "S01", "grp": "G5", "txt": "如何透過教學引導學生理解人類活動與野生動物生存危機的直接關聯，避免學生僅停留在「動物可愛需保護」的淺層認知？"}, {"n": 11, "id": "C522", "rev": "S22", "grp": "G7", "txt": "會想了解學生怎麼去理解漁獲對他們生活的影響的"}, {"n": 12, "id": "C219", "rev": "S24", "grp": "G3", "txt": "為什麼設計了那麼多口頭提問？如果增加一些書面回應會不會更好？"}, {"n": 13, "id": "C203", "rev": "S35", "grp": "G3", "txt": "小組人數安排再調整"}, {"n": 14, "id": "C112", "rev": "S03", "grp": "G2", "txt": "有辦法在課程時間內，將原本設計的完整課堂濃縮成符合的時間嗎？"}, {"n": 15, "id": "C051", "rev": "S05", "grp": "G2", "txt": "讓學生可以延伸概念不侷限在巧克力"}, {"n": 16, "id": "C075", "rev": "S02", "grp": "G1", "txt": "如何確保學生可以在實驗中學到知識？"}, {"n": 17, "id": "C457", "rev": "S21", "grp": "G6", "txt": "卡牌的設計讓學生學到很多"}, {"n": 18, "id": "C266", "rev": "S22", "grp": "G4", "txt": "可以探討課程怎麼修改比較符合此年齡的學生"}, {"n": 19, "id": "C276", "rev": "S26", "grp": "G4", "txt": "可以著重在台灣的環境可能可以讓學生更有共鳴或實踐的可能"}, {"n": 20, "id": "C040", "rev": "S39", "grp": "G1", "txt": "可以思考看看如果沒有糖果（小獎勵）來當外在動機，應該怎麼培養學生學習的內在動機👀"}, {"n": 21, "id": "C418", "rev": "S30", "grp": "G6", "txt": "我覺得桌遊的設計很好，而且讓學生能實際接觸到教具，並讓學習動機提升"}, {"n": 22, "id": "C216", "rev": "S12", "grp": "G3", "txt": "可以讓學生聽別組的東西 並上台報告他組的東西"}, {"n": 23, "id": "C323", "rev": "S45", "grp": "G5", "txt": "設計遊戲的時候可以假設自己是小學生下 程、提問方式或學習活動設計。", "inc": "對象是教學的做法與安排。", "exc": "涉及核心概念能否習得者歸「學習本質檢視」。", "eg": "可以說一個步驟、發一個器材，不一次全部發"}, {"layer": "調適取向", "code": "學習本質反思", "def": "檢視學生是否真能學到核心概念，涵蓋概念難易度、學習動機來源與生活經驗連結。", "inc": "須觸及「活動與所欲傳遞的概念之間是否確有對應」。", "exc": "僅談活動有不有趣、流程順不順者不算。", "eg": "課程的核心概念對國小生來說會不會太難？"}]};
const CODES = DATA.book.map(b => b.code);
const KEY = "sdgs-recode-142-v1";
let state = {};          // n -> {c:[0/1 ×9], m:"備註", seen:true}
let cur = 0;
let dirty = 0;           // 自上次匯出後改了幾筆
const STORE = (() => { try{ localStorage.setItem("_probe","1");
  localStorage.removeItem("_probe"); return true; }catch(e){ return false; } })();

function blank(){ return {c: CODES.map(()=>0), m:"", seen:false}; }
function load(){
  if(STORE){ try{ const s = localStorage.getItem(KEY); if(s) state = JSON.parse(s); }catch(e){} }
  DATA.segs.forEach(s => { if(!state[s.n]) state[s.n] = blank(); });
}
function save(){
  dirty++;
  if(STORE){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  const b = document.getElementById("exp");
  if(b) b.textContent = dirty ? `匯出 CSV（${dirty} 筆未存）` : "匯出 CSV";
  if(!STORE && dirty > 0 && dirty % 15 === 0)
    alert(`這個環境不會自動存檔，已經改了 ${dirty} 次。現在按「匯出 CSV」存一份，下次用「匯入進度」接回來。`);
}
const done = n => state[n] && state[n].seen;

/* ---------- 編碼手冊 ---------- */
const bookEl = document.getElementById("book");
DATA.book.forEach((b,i) => {
  const d = document.createElement("div");
  d.className = "item"; d.id = "bk"+i;
  d.innerHTML = `<dt><span class="k">${i+1}</span>${b.code}</dt>
    <dd>${b.def}</dd>
    <dd><b>納入</b>　${b.inc}</dd>
    <dd><b>排除</b>　${b.exc}</dd>
    <dd><b>例</b>　${b.eg}</dd>`;
  bookEl.appendChild(d);
});

/* ---------- 九個編碼按鈕，依三個行動層次分組 ---------- */
const groupsEl = document.getElementById("groups");
const layers = [];
DATA.book.forEach((b,i) => {
  let L = layers.find(x => x.name === b.layer);
  if(!L){ L = {name:b.layer, items:[]}; layers.push(L); }
  L.items.push({...b, idx:i});
});
layers.forEach(L => {
  const g = document.createElement("div"); g.className = "grp";
  g.innerHTML = `<div class="glab">${L.name}</div>`;
  const row = document.createElement("div"); row.className = "codes";
  L.items.forEach(it => {
    const btn = document.createElement("button");
    btn.className = "code"; btn.type = "button";
    btn.setAttribute("aria-pressed","false");
    btn.dataset.i = it.idx;
    btn.innerHTML = `<span class="k">${it.idx+1}</span><span class="nm">${it.code}</span>`;
    btn.onclick = () => toggle(it.idx);
    btn.onmouseenter = () => hot(it.idx);
    btn.onmouseleave = () => hot(-1);
    row.appendChild(btn);
  });
  g.appendChild(row); groupsEl.appendChild(g);
});
const btns = [...document.querySelectorAll(".code")];
function hot(i){ DATA.book.forEach((_,j) =>
  document.getElementById("bk"+j).classList.toggle("hot", j===i)); }

/* ---------- 進度格 ---------- */
const dotsEl = document.getElementById("dots");
DATA.segs.forEach((s,i) => {
  const b = document.createElement("button");
  b.className = "dot"; b.title = "第 "+s.n+" 筆";
  b.onclick = () => { cur = i; render(); };
  dotsEl.appendChild(b);
});
const dots = [...dotsEl.children];

/* ---------- 畫面 ---------- */
function render(){
  const s = DATA.segs[cur], st = state[s.n];
  document.getElementById("segno").textContent =
    `第 ${s.n} / ${DATA.segs.length} 筆　語料 ${s.id}　回饋者 ${s.rev}　受評 ${s.grp}`;
  document.getElementById("segtxt").textContent = s.txt;
  btns.forEach(b => {
    const on = st.c[+b.dataset.i] === 1;
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  document.getElementById("memo").value = st.m || "";
  const n = DATA.segs.filter(x => done(x.n)).length;
  document.getElementById("prog").textContent = `已編 ${n} / ${DATA.segs.length}`;
  document.getElementById("barfill").style.width = (n/DATA.segs.length*100)+"%";
  dots.forEach((d,i) => {
    const t = state[DATA.segs[i].n];
    d.classList.toggle("done", !!(t.seen && t.c.some(v=>v)));
    d.classList.toggle("zero", !!(t.seen && !t.c.some(v=>v)));
    d.classList.toggle("now", i===cur);
  });
  document.getElementById("finish").innerHTML = n === DATA.segs.length
    ? `<div class="done-msg">142 筆都編完了。按「匯出 CSV」存檔，再跑 <code>複編信度.py</code>。</div>` : "";
}
function toggle(i){
  const st = state[DATA.segs[cur].n];
  st.c[i] = st.c[i] ? 0 : 1; st.seen = true; save(); render();
}
function go(d){
  const t = cur + d;
  if(t >= 0 && t < DATA.segs.length){ cur = t; render();
    document.getElementById("segtxt").scrollIntoView({block:"nearest"}); }
}
document.getElementById("next").onclick = () => go(1);
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("zero").onclick = () => {
  const st = state[DATA.segs[cur].n];
  st.c = CODES.map(()=>0); st.seen = true; save(); render();
};
document.getElementById("jump").onclick = () => {
  const i = DATA.segs.findIndex(s => !done(s.n));
  if(i < 0){ alert("142 筆都編過了。"); return; }
  cur = i; render();
};
document.getElementById("memo").oninput = e => {
  state[DATA.segs[cur].n].m = e.target.value; save();
};
document.getElementById("theme").onclick = () => {
  const d = document.documentElement;
  const now = d.getAttribute("data-theme");
  const dark = now ? now === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  d.setAttribute("data-theme", dark ? "light" : "dark");
};

/* ---------- 鍵盤 ---------- */
addEventListener("keydown", e => {
  if(e.target.tagName === "TEXTAREA"){ if(e.key === "Escape") e.target.blur(); return; }
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key >= "1" && e.key <= "9"){ toggle(+e.key - 1); e.preventDefault(); }
  else if(e.key === "0"){ document.getElementById("zero").click(); e.preventDefault(); }
  else if(e.key === "Enter" || e.key === "ArrowRight"){ document.getElementById("next").click(); e.preventDefault(); }
  else if(e.key === "ArrowLeft"){ go(-1); e.preventDefault(); }
  else if(e.key.toLowerCase() === "n"){ document.getElementById("memo").focus(); e.preventDefault(); }
});

/* ---------- 匯出 / 匯入 ---------- */
const q = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
document.getElementById("exp").onclick = () => {
  const head = ["序號","語料編號","回饋者","受評小組","語料內容",...CODES,"備註","已編"];
  const rows = DATA.segs.map(s => {
    const st = state[s.n];
    return [s.n,s.id,s.rev,s.grp,s.txt,...st.c,st.m,st.seen?1:0].map(q).join(",");
  });
  const csv = "﻿" + [head.map(q).join(","), ...rows].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "編碼結果_複編.csv"; a.click();
  dirty = 0; document.getElementById("exp").textContent = "匯出 CSV";
  const n = DATA.segs.filter(x => done(x.n)).length;
  if(n < DATA.segs.length) alert(`注意：只編了 ${n} / ${DATA.segs.length} 筆，未編的列「已編」欄為 0。`);
};
document.getElementById("imp").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const rows = parseCSV(r.result.replace(/^﻿/,""));
      const head = rows[0], iN = head.indexOf("序號"), iM = head.indexOf("備註"),
            iS = head.indexOf("已編"), ci = CODES.map(c => head.indexOf(c));
      if(iN < 0 || ci.some(i => i < 0)) throw new Error("欄位對不上");
      const have = DATA.segs.filter(x => done(x.n) || (state[x.n] && state[x.n].m)).length;
      if(have && !confirm(`這會用檔案裡的內容覆蓋你目前的 ${have} 筆編碼，無法復原。\n\n請確認這個檔案是你自己先前「匯出 CSV」存下的進度檔，不是別人的編碼結果。\n\n確定要匯入嗎？`)) return;
      let k = 0;
      rows.slice(1).forEach(row => {
        const n = +row[iN]; if(!state[n]) return;
        state[n].c = ci.map(i => row[i] === "1" ? 1 : 0);
        if(iM >= 0) state[n].m = row[iM];
        state[n].seen = iS >= 0 ? row[iS] === "1" : state[n].c.some(v=>v);
        k++;
      });
      save(); dirty = 0; cur = 0; render();
      document.getElementById("exp").textContent = "匯出 CSV";
      alert(`匯入 ${k} 筆。`);
    }catch(err){ alert("匯入失敗：" + err.message); }
  };
  r.readAsText(f); e.target.value = "";
};
function parseCSV(t){
  const out = []; let row = [], f = "", qt = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(qt){
      if(c === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else qt = false; }
      else f += c;
    } else if(c === '"') qt = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n"){ row.push(f); out.push(row); row = []; f = ""; }
    else if(c !== "\r") f += c;
  }
  if(f.length || row.length){ row.push(f); out.push(row); }
  return out.filter(r => r.length > 1);
}

addEventListener("beforeunload", e => {
  if(dirty > 0){ e.preventDefault(); e.returnValue = ""; }
});
if(!STORE){
  const n = document.querySelector(".note");
  n.style.borderColor = "var(--acc2)";
  n.innerHTML = `<b>這個環境不會自動存檔。</b>進度只存在記憶體裡，關掉或重新整理就沒了。
    請每編十幾筆就按一次「匯出 CSV」，下次用「匯入進度」把檔案讀回來接著編。
    把 <code>編碼工具.html</code> 從 Finder 用瀏覽器開啟，就會自動存檔。
    另外：不要開 <code>編碼信度_原始編碼對照（勿交給第二編碼者）.csv</code>。`;
}
load();
const first = DATA.segs.findIndex(s => !done(s.n));
cur = first < 0 ? 0 : first;
render();
</script>
